<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Night Transit Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="50%" stop-color="#0E3854" />
      <stop offset="100%" stop-color="#081A2F" />
    </linearGradient>

    <!-- Subdued Ambient Glow in Background -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0D9488" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F2B48" stop-opacity="0" />
    </radialGradient>

    <!-- Pin Outer Shape Gradient: Vibrant Calming Teal / Cyan to Emerald-Teal -->
    <linearGradient id="pinGrad" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Warm Amber / Sunrise Wake Alert Accent Gradient -->
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Gentle Pin Inner Dark Backdrop Gradient -->
    <linearGradient id="pinCoreNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071E33" />
      <stop offset="100%" stop-color="#041220" />
    </linearGradient>

    <!-- Soft Drop Shadow for Primary Pin -->
    <filter id="pinShadow" x="-20%" y="-15%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#030A14" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#030A14" flood-opacity="0.3" />
    </filter>

    <!-- Subtle Glow for Alert Star/Beacons -->
    <filter id="wakeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base App Background (Android squircle / rounded canvas friendly, 512x512) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Ambient Sub-Glow -->
  <rect width="512" height="512" rx="116" fill="url(#ambientGlow)" />

  <!-- Subtle Transit Waypoint / Compass Orbit Track (Safe zone centered) -->
  <circle cx="256" cy="235" r="145" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="7 11" opacity="0.22" />

  <!-- Outer Pin Body with Drop Shadow -->
  <g filter="url(#pinShadow)">
    <!-- Modern rounded smooth location pin -->
    <!-- Head radius ~88px centered at (256, 215), tapering softly down to (256, 360) with rounded base -->
    <path d="M 256 122
             C 198 122 152 168 152 226
             C 152 278 206 338 245.5 373.2
             C 251.5 378.5 260.5 378.5 266.5 373.2
             C 306 338 360 278 360 226
             C 360 168 314 122 256 122 Z"
          fill="url(#pinGrad)" />
    
    <!-- Pin Interior Disc (Cosy night window) -->
    <circle cx="256" cy="226" r="68" fill="url(#pinCoreNight)" />
    
    <!-- Smooth Crescent Moon merged inside the pin core (Representing sweet commuter transit sleep) -->
    <path d="M 276 182
             C 241.5 182 215 208.5 215 243
             C 215 268 229.5 289.5 251 299
             C 244 290 239.5 278.5 239.5 266
             C 239.5 236 264 211.5 294 211.5
             C 301.5 211.5 308.5 213 315 215.8
             C 306 195.8 292.5 182 276 182 Z"
          fill="#E2E8F0"
          opacity="0.95" />

    <!-- Crescent Moon Subtle Inner Glow / Eye-lid peaceful slant -->
    <path d="M 230 250 C 235 257 245 257 250 250" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Sleeping 'Z' Motif drifting softly in the night sky within the pin -->
    <path d="M 270 236 L 282 236 L 270 250 L 282 250" fill="none" stroke="#67E8F9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
    <path d="M 288 220 L 297 220 L 288 230 L 297 230" fill="none" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>

  <!-- The "Wake Alert" Accent — An energetic warm sunrise beacon perched at top-right of the pin -->
  <!-- Represents the timely, friendly wake-up prompt before the destination stop -->
  <g filter="url(#wakeGlow)">
    <!-- Expanding friendly alert pulse waves -->
    <path d="M 334 148 C 348 162 355 178 357 194" fill="none" stroke="url(#alertGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <path d="M 349 133 C 369 153 378 174 380 196" fill="none" stroke="url(#alertGrad)" stroke-width="4" stroke-linecap="round" opacity="0.55" />

    <!-- Vibrant Alert Star / Sun Sparkle Symbol -->
    <!-- Centered at approx (320, 160) -->
    <path d="M 320 144
             C 320 154 328 160 338 160
             C 328 160 320 166 320 176
             C 320 166 312 160 302 160
             C 312 160 320 154 320 144 Z"
          fill="url(#alertGrad)" />
    
    <!-- Mini secondary alert sparkle -->
    <circle cx="350" cy="125" r="4.5" fill="#FDE047" />
  </g>

  <!-- Destination Transit Station Dot at the Pin Base (Anchoring arrival) -->
  <g>
    <ellipse cx="256" cy="404" rx="42" ry="10" fill="#051220" opacity="0.5" />
    <ellipse cx="256" cy="402" rx="24" ry="6" fill="#14B8A6" opacity="0.35" />
    <circle cx="256" cy="402" r="7" fill="#F59E0B" />
    <circle cx="256" cy="402" r="3.5" fill="#FEF3C7" />
  </g>
</svg>